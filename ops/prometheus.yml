global:
  scrape_interval: 10s

scrape_configs:
  # DNS discovery rather than a static target: with `--scale consumer=N`,
  # Docker's DNS returns one A record per replica, so every replica is scraped.
  # Sum lag across them for the group total:
  #   sum by (group) (fraud_consumer_lag_messages)
  - job_name: scoring-consumer
    dns_sd_configs:
      - names: [consumer]
        type: A
        port: 9100
        refresh_interval: 10s

  - job_name: results-consumer
    dns_sd_configs:
      - names: [results-consumer]
        type: A
        port: 9100
        refresh_interval: 10s

  - job_name: api
    static_configs:
      - targets: ["api:8000"]
